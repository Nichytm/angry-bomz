      <button class="game-card" data-game="boss"><span><strong>Босс двора</strong><small>Уворачивайся от залпов и сломай щит босса.</small></span><img src="assets/friend4.webp" alt=""></button>

<script src="arcade.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const phone = matchMedia('(max-width: 650px) and (orientation: portrait)');
let W = phone.matches ? 720 : 1280;
let H = phone.matches ? 800 : 720;
let GROUND_Y = H - 100;
let SLING_X = phone.matches ? 145 : 200;
let SLING_Y = GROUND_Y - 30;
canvas.width = W; canvas.height = H;

// === AUDIO ===
let bgMusic = null;
const birdSounds = Array(6).fill(null);
const friendCanvases = Array(6).fill(null);
let muted = false;
let soundContext;
function effect(...notes) {
  const AudioEngine = window.AudioContext || window.webkitAudioContext;
  if (muted || !AudioEngine) return;
  soundContext ??= new AudioEngine();
  soundContext.resume().catch(() => {});
  const start = soundContext.currentTime;
  notes.forEach((note, index) => {
    const oscillator = soundContext.createOscillator();
    const envelope = soundContext.createGain();
    const time = start + index * 0.08;
    oscillator.type = 'triangle';
    oscillator.frequency.setValueAtTime(note, time);
    envelope.gain.setValueAtTime(0.16, time);
    envelope.gain.exponentialRampToValueAtTime(0.001, time + 0.16);
    oscillator.connect(envelope).connect(soundContext.destination);
    oscillator.start(time);
    oscillator.stop(time + 0.16);
  });
}
function playMusic() {
  if (bgMusic && !muted) bgMusic.play().catch(() => {});
}
document.addEventListener('click', playMusic);
const mute = document.getElementById('mute');
mute.addEventListener('click', () => {
  muted = !muted;
  mute.textContent = muted ? 'Звук выкл.' : 'Звук вкл.';
  mute.setAttribute('aria-pressed', muted);
  if (muted) {
    bgMusic?.pause();
    birdSounds.forEach(audio => audio?.pause());
    soundContext?.suspend().catch(() => {});
  }
});

// === AUTO-LOAD from same folder (GitHub Pages / local server) ===
function tryLoadImage(idx, names) {
  let i = 0;
  function next() {
    if (i >= names.length) return;
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = 56; c.height = 56;
      const x = c.getContext('2d');
      x.beginPath(); x.arc(28, 28, 28, 0, Math.PI * 2); x.clip();
      const s = Math.min(img.width, img.height);
      x.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, 56, 56);
      friendCanvases[idx] = c;
    };
    img.onerror = () => { i++; next(); };
    img.src = names[i];
  }
  next();
}

function tryLoadSound(idx, names) {
  let i = 0;
  function next() {
    if (i >= names.length) return;
    const a = new Audio(names[i]);
    a.oncanplaythrough = () => { birdSounds[idx] = a; a.volume = 0.8; };
    a.onerror = () => { i++; next(); };
    a.load();
  }
  next();
}

function tryLoadMusic(names) {
  let i = 0;
  function next() {
    if (i >= names.length) return;
    const a = new Audio(names[i]);
    a.oncanplaythrough = () => {
      bgMusic = a; bgMusic.loop = true; bgMusic.volume = 0.45;
      playMusic();
    };
    a.onerror = () => { i++; next(); };
    a.load();
  }
  next();
}

tryLoadImage(0, ['friend1.png','friend1.jpg','friend1.jpeg','friend1.webp']);
tryLoadImage(1, ['friend2.png','friend2.jpg','friend2.jpeg','friend2.webp']);
tryLoadImage(2, ['friend3.png','friend3.jpg','friend3.jpeg','friend3.webp']);
tryLoadImage(3, ['assets/friend4.webp']);
tryLoadImage(4, ['assets/friend5.webp']);
tryLoadImage(5, ['assets/friend6.webp']);
tryLoadSound(0, ['sound1.mp3','sound1.wav','sound1.ogg']);
tryLoadSound(1, ['sound2.mp3','sound2.wav','sound2.ogg']);
tryLoadSound(2, ['sound3.mp3','sound3.wav','sound3.ogg']);
tryLoadMusic(['music.mp3','music.wav','music.ogg']);

// Drag-drop still works as bonus fallback
document.body.addEventListener('dragover', e => e.preventDefault());
document.body.addEventListener('drop', e => {
  e.preventDefault();
  [...e.dataTransfer.files].forEach(f => {
    const n = f.name.toLowerCase();
    if (f.type.startsWith('image/')) {
      const idx = n.includes('friend1') ? 0 : n.includes('friend2') ? 1 : n.includes('friend3') ? 2 : -1;
      if (idx >= 0) {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas'); c.width = 56; c.height = 56;
          const x = c.getContext('2d');
          x.beginPath(); x.arc(28,28,28,0,Math.PI*2); x.clip();
          const s = Math.min(img.width,img.height);
          x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,56,56);
          friendCanvases[idx] = c;
        };
        img.src = URL.createObjectURL(f);
      }
    }
    if (f.type.startsWith('audio/')) {
      const n2 = f.name.toLowerCase();
      const idx = n2.includes('sound1') ? 0 : n2.includes('sound2') ? 1 : n2.includes('sound3') ? 2 : -1;
      if (idx >= 0) { birdSounds[idx] = new Audio(URL.createObjectURL(f)); birdSounds[idx].volume = 0.8; }
      if (n2.includes('music')) {
        if (bgMusic) bgMusic.pause();
        bgMusic = new Audio(URL.createObjectURL(f)); bgMusic.loop = true; bgMusic.volume = 0.45; playMusic();
      }
    }
  });
});



// === CONSTANTS ===
const FRIENDS = [
  { name: 'Егорчик',   color: '#DC4040', glowColor: '#ff8080', ability: 'normal' },
  { name: 'Богданчик', color: '#40A0DC', glowColor: '#80d0ff', ability: 'speed'  },
  { name: 'Иллюша',    color: '#40CC60', glowColor: '#80ff90', ability: 'heavy'  },
  { name: 'Хитрец', color: '#ff8652', glowColor: '#ffab76', ability: 'speed' },
  { name: 'Очкарик', color: '#a590ff', glowColor: '#c4b8ff', ability: 'heavy' },
  { name: 'Фаер', color: '#ff69a6', glowColor: '#ff95c3', ability: 'speed' },
];

// === PARTICLES ===
const particles = [];
function explode(x, y, color, n = 30) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 2 + Math.random() * 12;
    particles.push({
      x, y,
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd - Math.random() * 6,
      life: 20 + Math.random() * 40,
      maxLife: 0,
      color,
      size: 3 + Math.random() * 7
    });
    particles[particles.length-1].maxLife = particles[particles.length-1].life;
  }
}
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function drawParticles() {
  particles.forEach(p => {
    const a = p.life / p.maxLife;
    const r = p.size * a;
    ctx.globalAlpha = a * 0.9;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// Cache the static backdrop on each viewport layout.
let backdrop;
function drawBackground() {
  if (!backdrop) {
    backdrop = document.createElement('canvas');
    backdrop.width = W;
    backdrop.height = H;
    const paint = backdrop.getContext('2d');
    const sky = paint.createLinearGradient(0, 0, 0, GROUND_Y);
    sky.addColorStop(0, '#162434');
    sky.addColorStop(0.6, '#527b76');
    sky.addColorStop(1, '#d8a47a');
    paint.fillStyle = sky;
    paint.fillRect(0, 0, W, H);
    paint.fillStyle = '#f9dda3';
    paint.beginPath();
    paint.arc(W * 0.74, GROUND_Y * 0.38, 65, 0, Math.PI * 2);
    paint.fill();
    const rand = seededRand(291);
    for (let i = 0; i < 65; i++) {
      paint.fillStyle = 'rgba(255,245,216,.55)';
      paint.fillRect(rand() * W, rand() * GROUND_Y * .65, 2, 2);
    }
    for (const layer of [0, 1]) {
      for (let x = -20; x < W; x += 53) {
        const width = 41 + rand() * 45;
        const height = 42 + rand() * (layer ? 42 : 110);
        const y = GROUND_Y - height;
        paint.fillStyle = layer ? '#31494a' : '#496265';
        paint.fillRect(x, y, width, height);
        paint.fillStyle = layer ? '#b58d5a' : '#7c9290';
        for (let row = y + 12; row < GROUND_Y - 8; row += 18) {
          for (let col = x + 9; col < x + width - 9; col += 15) {
            if (rand() > .45) paint.fillRect(col, row, 4, 5);
          }
        }
      }
    }
    paint.fillStyle = '#202d2d';
    paint.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    paint.fillStyle = '#a2b865';
    paint.fillRect(0, GROUND_Y, W, 6);
    paint.fillStyle = '#46574b';
    for (let x = -25; x < W; x += 64) {
      paint.fillRect(x, GROUND_Y + 27, 54, 2);
      paint.fillRect(x + 30, GROUND_Y + 55, 54, 2);
    }
  }
  ctx.drawImage(backdrop, 0, 0);
}

// === SLINGSHOT ===
function drawSlingshot(x, y, bird, dragging, dragPos) {
  const forkL = [x - 18, y - 60];
  const forkR = [x + 18, y - 60];
  const base  = [x, y + 30];

  // Shadow
  ctx.save();
  ctx.globalAlpha = 0.2;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x, y + 32, 20, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Main stick
  ctx.strokeStyle = '#5a2d0c'; ctx.lineWidth = 14; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(...base); ctx.lineTo(x, y - 20); ctx.stroke();
  ctx.strokeStyle = '#8B4513';
  ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(...base); ctx.lineTo(x, y - 20); ctx.stroke();

  // Forks
  ctx.strokeStyle = '#5a2d0c'; ctx.lineWidth = 12;
  ctx.beginPath(); ctx.moveTo(x, y - 20); ctx.lineTo(...forkL); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y - 20); ctx.lineTo(...forkR); ctx.stroke();
  ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(x, y - 20); ctx.lineTo(...forkL); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y - 20); ctx.lineTo(...forkR); ctx.stroke();

  // Rubber bands
  let bx = x, by = y - 65;
  if (dragging && dragPos) { bx = dragPos[0]; by = dragPos[1]; }
  else if (bird && !bird.launched) { bx = bird.x; by = bird.y; }

  if (dragging || (bird && !bird.launched)) {
    ctx.strokeStyle = '#4a2000'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(...forkL); ctx.lineTo(bx, by); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(...forkR); ctx.lineTo(bx, by); ctx.stroke();
    ctx.strokeStyle = '#7a4010'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(...forkL); ctx.lineTo(bx, by); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(...forkR); ctx.lineTo(bx, by); ctx.stroke();
  }

  // Fork tips
  [forkL, forkR].forEach(([fx, fy]) => {
    ctx.fillStyle = '#4a2000';
    ctx.beginPath(); ctx.arc(fx, fy, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8B4513';
    ctx.beginPath(); ctx.arc(fx, fy, 5, 0, Math.PI * 2); ctx.fill();
  });
}

// === BIRD ===
class Bird {
  constructor(x, y, fi) {
    this.x = x; this.y = y;
    this.r = 28; this.fi = fi;
    this.vx = 0; this.vy = 0;
    this.launched = false;
    this.alive = true;
    this.trail = [];
    this.abilityUsed = false;
    this.landed = false;
    this.landTimer = 0;
    this.angle = 0;
    this.squish = 1;
  }
  get ability() { return FRIENDS[this.fi].ability; }
  get color() { return FRIENDS[this.fi].color; }
  get glowColor() { return FRIENDS[this.fi].glowColor; }

  launch(vx, vy) {
    this.vx = vx; this.vy = vy; this.launched = true;
    if (muted) return;
    const audio = birdSounds[this.fi];
    if (audio) {
      audio.currentTime = 0;
      audio.play().catch(() => effect(360, 510));
    } else {
      const motifs = [[360, 510], [420, 650], [240, 160], [490, 740], [320, 220, 160], [520, 680, 870]];
      effect(...motifs[this.fi]);
    }
  }

  useAbility() {
    if (this.abilityUsed || !this.launched || this.landed || this.ability === 'normal') return;
    effect(480, 720);
    this.abilityUsed = true;
    if (this.ability === 'speed') {
      const m = Math.hypot(this.vx, this.vy);
      if (m > 0) { this.vx = this.vx / m * m * 1.9; this.vy = this.vy / m * m * 0.25; }
      explode(this.x, this.y, '#FFD700', 25);
    } else if (this.ability === 'heavy') {
      this.vy = Math.max(this.vy, 10); this.vx *= 0.4;
      explode(this.x, this.y, '#9955FF', 25);
    }
  }

  update() {
    if (!this.launched) return;
    this.trail.push({x: this.x, y: this.y});
    if (this.trail.length > 35) this.trail.shift();
    this.x += this.vx; this.y += this.vy; this.vy += 0.38;
    this.angle = Math.atan2(this.vy, this.vx);
    this.squish = 1 + 0.1 * Math.sin(Date.now() / 80);
    if (this.y >= GROUND_Y - this.r) {
      this.y = GROUND_Y - this.r; this.vy *= -0.28; this.vx *= 0.8;
      if (!this.landed) { this.landed = true; explode(this.x, this.y, this.color, 22); }
      this.landTimer++;
      if (this.landTimer > 65) this.alive = false;
    }
    if (this.x > W + 120 || this.x < -120) this.alive = false;
  }

  draw() {
    // Trail
    this.trail.forEach((p, i) => {
      const a = i / this.trail.length;
      const r = this.r * 0.4 * a;
      ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    const ix = Math.round(this.x), iy = Math.round(this.y);

    // Glow
    ctx.save();
    ctx.shadowBlur = 20; ctx.shadowColor = this.glowColor;
    ctx.beginPath(); ctx.arc(ix, iy, this.r, 0, Math.PI * 2);
    ctx.fillStyle = this.color; ctx.fill();
    ctx.restore();

    // Photo or fallback
    const fc = friendCanvases[this.fi];
    if (fc) {
      ctx.save();
      ctx.translate(ix, iy);
      ctx.rotate(this.launched ? this.angle * 0.3 : 0);
      ctx.drawImage(fc, -this.r, -this.r, this.r * 2, this.r * 2);
      ctx.restore();
    } else {
      // Cartoon face
      ctx.save();
      ctx.translate(ix, iy);
      ctx.scale(this.squish, 2 - this.squish);
      ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI * 2);
      ctx.fillStyle = this.color; ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2; ctx.stroke();

      // Eyes
      [[-9, -6],[9, -6]].forEach(([ex, ey]) => {
        ctx.beginPath(); ctx.arc(ex, ey, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#fff'; ctx.fill();
        ctx.beginPath(); ctx.arc(ex + 1, ey + 1, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#222'; ctx.fill();
        ctx.beginPath(); ctx.arc(ex + 2, ey, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = '#fff'; ctx.fill();
      });

      // Eyebrows (angry)
      ctx.strokeStyle = '#222'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-16, -14); ctx.lineTo(-6, -11); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(16, -14); ctx.lineTo(6, -11); ctx.stroke();

      // Name
      ctx.fillStyle = '#fff'; ctx.font = 'bold 9px system-ui,sans-serif';
      ctx.textAlign = 'center';
      const nm = FRIENDS[this.fi].name;
      ctx.fillText(nm, 0, this.r + 13);
      ctx.restore();
    }

    // Ability dot
    if (!this.abilityUsed && this.launched) {
      const dotCol = this.ability === 'speed' ? '#FFD700' : this.ability === 'heavy' ? '#CC44FF' : '#ffffff';
      ctx.fillStyle = dotCol;
      ctx.beginPath(); ctx.arc(ix + this.r - 5, iy - this.r + 5, 7, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(ix + this.r - 5, iy - this.r + 5, 7, 0, Math.PI * 2); ctx.stroke();
    }
  }
}

// === BLOCK ===
class Block {
  constructor(x, y, w, h, mat = 'wood') {
    this.x = x; this.y = y; this.w = w; this.h = h; this.mat = mat;
    const mats = { wood: { hp: 3, col: '#b97840', dark: '#7a4f1a' },
                   stone: { hp: 6, col: '#909098', dark: '#555560' },
                   ice:   { hp: 2, col: '#a0d0ff', dark: '#6090cc' } };
    const m = mats[mat] || mats.wood;
    this.hp = m.hp; this.maxHp = m.hp; this.col = m.col; this.darkCol = m.dark;
  }
  get rect() { return {x: this.x, y: this.y, w: this.w, h: this.h}; }

  hit(dmg) {
    this.hp -= dmg;
    explode(this.x + this.w/2, this.y + this.h/2, this.hp > 0 ? this.col : '#ff8800', 14);
    return this.hp <= 0;
  }

  draw() {
    const ratio = this.hp / this.maxHp;
    const t = ctx;
    const cx = this.x + this.w/2, cy = this.y + this.h/2;

    // Shadow
    t.save(); t.globalAlpha = 0.15;
    t.fillStyle = '#000';
    t.fillRect(this.x + 3, this.y + 3, this.w, this.h);
    t.restore();

    // Body
    const r = (1 - ratio) * 0.4;
    const col = lerpColor(this.col, '#333', r);
    t.fillStyle = col;
    t.beginPath();
    t.roundRect(this.x, this.y, this.w, this.h, 5);
    t.fill();

    // Highlight
    const hiGrad = t.createLinearGradient(this.x, this.y, this.x, this.y + this.h);
    hiGrad.addColorStop(0, 'rgba(255,255,255,0.35)');
    hiGrad.addColorStop(0.5, 'rgba(255,255,255,0)');
    t.fillStyle = hiGrad;
    t.beginPath(); t.roundRect(this.x, this.y, this.w, this.h/2, 5); t.fill();

    // Border
    t.strokeStyle = this.darkCol; t.lineWidth = 2;
    t.beginPath(); t.roundRect(this.x, this.y, this.w, this.h, 5); t.stroke();

    // Cracks
    if (ratio < 0.65) {
      t.strokeStyle = 'rgba(0,0,0,0.6)'; t.lineWidth = 1.5;
      t.beginPath(); t.moveTo(cx - 6, cy - 8); t.lineTo(cx + 4, cy + 10); t.stroke();
    }
    if (ratio < 0.35) {
      t.beginPath(); t.moveTo(cx + 7, cy - 9); t.lineTo(cx - 5, cy + 7); t.stroke();
      t.beginPath(); t.moveTo(cx - 10, cy); t.lineTo(cx + 10, cy - 3); t.stroke();
    }
  }
}

function lerpColor(a, b, t) {
  const ah = parseInt(a.slice(1), 16), bh = parseInt(b.slice(1), 16);
  const ar = (ah >> 16) & 0xff, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
  const br = (bh >> 16) & 0xff, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
  return `rgb(${~~(ar + (br-ar)*t)},${~~(ag + (bg-ag)*t)},${~~(ab + (bb-ab)*t)})`;
}

// === PIG ===
class Pig {
  constructor(x, y) {
    this.x = x; this.y = y; this.r = 22;
    this.hp = 3; this.maxHp = 3; this.alive = true; this.wobble = 0;
    this.hatAngle = (Math.random() - 0.5) * 0.3;
  }

  hit(dmg) {
    this.hp -= dmg; this.wobble = 20;
    if (this.hp <= 0) { this.alive = false; explode(this.x, this.y, '#64C832', 40); }
    return !this.alive;
  }

  draw() {
    const t = ctx;
    const {x, y, r} = this;
    const wo = this.wobble > 0 ? Math.sin(this.wobble * 0.5) * 3 : 0;
    const cy = y + wo;
    const ratio = this.hp / this.maxHp;

    // Shadow
    t.save(); t.globalAlpha = 0.2;
    t.fillStyle = '#000';
    t.beginPath(); t.ellipse(x, y + r + 3, r * 1.1, r * 0.3, 0, 0, Math.PI * 2); t.fill();
    t.restore();

    // Body glow
    t.save(); t.shadowBlur = 12; t.shadowColor = '#00cc44';
    t.beginPath(); t.arc(x, cy, r, 0, Math.PI * 2);
    t.fillStyle = '#64C832'; t.fill();
    t.restore();

    // Body border
    t.strokeStyle = '#3a9a1a'; t.lineWidth = 3;
    t.beginPath(); t.arc(x, cy, r, 0, Math.PI * 2); t.stroke();

    // Belly
    t.fillStyle = '#80e050';
    t.beginPath(); t.ellipse(x + 2, cy + 4, r * 0.6, r * 0.45, 0, 0, Math.PI * 2); t.fill();

    // Snout
    t.fillStyle = '#3a9a1a';
    t.beginPath(); t.ellipse(x, cy + r * 0.5 - 2, 9, 7, 0, 0, Math.PI * 2); t.fill();
    t.fillStyle = '#1a5a0a';
    [[-4, 0],[4, 0]].forEach(([nx, ny]) => {
      t.beginPath(); t.arc(x + nx, cy + r * 0.5 - 2 + ny, 2.5, 0, Math.PI * 2); t.fill();
    });

    // Eyes
    const eyeY = cy - r * 0.3;
    t.fillStyle = '#fff';
    t.beginPath(); t.arc(x - 8, eyeY, 7, 0, Math.PI * 2); t.fill();
    t.beginPath(); t.arc(x + 8, eyeY, 7, 0, Math.PI * 2); t.fill();

    if (ratio > 0.6) {
      t.fillStyle = '#222';
      t.beginPath(); t.arc(x - 7, eyeY, 4, 0, Math.PI * 2); t.fill();
      t.beginPath(); t.arc(x + 9, eyeY, 4, 0, Math.PI * 2); t.fill();
      // Shine
      t.fillStyle = '#fff';
      t.beginPath(); t.arc(x - 6, eyeY - 1, 1.5, 0, Math.PI * 2); t.fill();
      t.beginPath(); t.arc(x + 10, eyeY - 1, 1.5, 0, Math.PI * 2); t.fill();
      // Smile
      t.strokeStyle = '#1a5a0a'; t.lineWidth = 2;
      t.beginPath(); t.arc(x, cy + r * 0.65, 6, 0.2, Math.PI - 0.2); t.stroke();
    } else if (ratio > 0.3) {
      // Scared
      t.fillStyle = '#222';
      t.beginPath(); t.arc(x - 6, eyeY + 2, 5, 0, Math.PI * 2); t.fill();
      t.beginPath(); t.arc(x + 10, eyeY + 2, 5, 0, Math.PI * 2); t.fill();
      // Sweat
      t.fillStyle = '#a0d0ff';
      t.beginPath(); t.arc(x + 18, cy - 5, 4, 0, Math.PI * 2); t.fill();
    } else {
      // X eyes
      t.strokeStyle = '#cc0000'; t.lineWidth = 3; t.lineCap = 'round';
      [[-8, eyeY],[8, eyeY]].forEach(([ex, ey]) => {
        t.beginPath(); t.moveTo(ex - 5, ey - 5); t.lineTo(ex + 5, ey + 5); t.stroke();
        t.beginPath(); t.moveTo(ex + 5, ey - 5); t.lineTo(ex - 5, ey + 5); t.stroke();
      });
    }

    // Ears
    t.fillStyle = '#4ab820'; t.strokeStyle = '#2a8010'; t.lineWidth = 2;
    [[-r + 4, -r + 2],[r - 4, -r + 2]].forEach(([ex, ey]) => {
      t.beginPath();
      t.arc(x + ex, cy + ey, 8, 0, Math.PI * 2);
      t.fill(); t.stroke();
    });

    // HP bar
    const bw = r * 2.2, bh = 6;
    const bx = x - r * 1.1, by = y - r - 14;
    t.fillStyle = 'rgba(0,0,0,0.5)';
    t.beginPath(); t.roundRect(bx - 1, by - 1, bw + 2, bh + 2, 3); t.fill();
    t.fillStyle = '#cc2200';
    t.beginPath(); t.roundRect(bx, by, bw, bh, 2); t.fill();
    t.fillStyle = ratio > 0.5 ? '#22cc44' : ratio > 0.25 ? '#ffaa00' : '#ff3300';
    t.beginPath(); t.roundRect(bx, by, bw * ratio, bh, 2); t.fill();

    if (this.wobble > 0) this.wobble--;
  }
}

// === LEVEL GENERATOR ===
function seededRand(seed) {
  let s = seed;
  return () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
}

function makeLevel(lvl) {
  const rng = seededRand(lvl * 137 + 42);
  const pigs = [], blocks = [];
  const nPigs = Math.min(2 + Math.floor(lvl / 3), 8);
  const nTowers = Math.max(1, Math.min(nPigs, 4));

  const mats = ['wood', 'ice', 'stone'];
  const wW = [Math.max(0, 1 - lvl * 0.03), 0.3, Math.min(0.7, lvl * 0.03)];
  function pickMat() {
    const total = wW.reduce((a, b) => a + b, 0);
    let r = rng() * total;
    for (let i = 0; i < 3; i++) { r -= wW[i]; if (r <= 0) return mats[i]; }
    return 'wood';
  }

  let placed = 0;
  for (let t = 0; t < nTowers; t++) {
    const towerStart = phone.matches ? 340 : 650;
    const towerSpacing = phone.matches ? 95 : 157;
    const bx = towerStart + t * towerSpacing + Math.floor(rng() * 30) - 15;
    const hBlocks = 1 + Math.floor(rng() * (2 + Math.floor(lvl / 5)));
    for (let row = 0; row < hBlocks; row++) {
      const mat = pickMat();
      const bw = [40, 60, 80][Math.floor(rng() * 3)];
      const bh = 30;
      blocks.push(new Block(bx - bw/2, GROUND_Y - bh * (row + 1), bw, bh, mat));
      if (row === hBlocks - 1 && placed < nPigs) {
        pigs.push(new Pig(bx, GROUND_Y - bh * hBlocks - 25));
        placed++;
        if (rng() < 0.4) {
          blocks.push(new Block(Math.min(bx + 40, W - 44), GROUND_Y - 30, 40, 30, pickMat()));
        }
      }
    }
    if (placed < nPigs && rng() < 0.5) {
      pigs.push(new Pig(bx + Math.floor(rng() * 60) - 30, GROUND_Y - 25));
      placed++;
    }
  }
  while (placed < nPigs) {
    pigs.push(new Pig((phone.matches ? 330 : 650) + Math.floor(rng() * (phone.matches ? 310 : 450)), GROUND_Y - 25));
    placed++;
  }
  return { pigs, blocks };
}

function birdsForLevel(lvl) {
  const total = Math.max(3, Math.min(3 + Math.floor(lvl / 5), 9));
  return Array.from({length: total}, (_, i) => (i + (lvl - 1) * 3) % FRIENDS.length);
}

// === TRAJECTORY PREVIEW ===
function drawTrajectory(birdX, birdY, slX, slY) {
  const ddx = slX - birdX, ddy = (slY - 65) - birdY;
  let pvx = ddx * shotPower(), pvy = ddy * shotPower();
  let px = birdX, py = birdY;
  for (let i = 0; i < 32; i++) {
    px += pvx; py += pvy; pvy += 0.38;
    if (py > GROUND_Y) break;
    const a = i / 32;
    ctx.globalAlpha = 0.93 - a * 0.54;
    ctx.fillStyle = '#dcfa59';
    ctx.beginPath(); ctx.arc(px, py, 6 - a * 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// === GAME STATE MACHINE ===
let state = 'title';
let levelNum = 1, totalScore = 0;
let levelData = null;
let birdQueue = [], birdIdx = 0;
let currentBird = null, launchedBird = null;
let dragging = false, dragPos = null;
let waitTimer = 0;
let levelScore = 0;
let shake = 0;

function startLevel(lvl) {
  cancelDrag();
  shake = 0;
  levelData = makeLevel(lvl);
  birdQueue = birdsForLevel(lvl);
  birdIdx = 0;
  currentBird = new Bird(SLING_X, SLING_Y - 65, birdQueue[0]);
  launchedBird = null; dragging = false; dragPos = null;
  waitTimer = 0; levelScore = 0;
  particles.length = 0;
  state = 'game';
}

// === INPUT ===
let dragPointer = null;
let activeMode = 'campaign';
const campaignActions = document.getElementById('campaign-actions');
const campaignPanel = document.getElementById('campaign-panel');
const campaignHud = document.getElementById('campaign-hud');
const campaignOverlay = document.getElementById('campaign-overlay');
const campaignHeading = document.getElementById('campaign-heading');
const campaignSummary = document.getElementById('campaign-summary');
const levelReadout = document.getElementById('level-readout');
const scoreReadout = document.getElementById('score-readout');
const targetsReadout = document.getElementById('targets-readout');
const queueReadout = document.getElementById('queue');
const cast = document.getElementById('cast');
const campaignTip = document.getElementById('campaign-tip');
const portraitPaths = ['friend1.png', 'friend2.png', 'friend3.png', 'assets/friend4.webp', 'assets/friend5.webp', 'assets/friend6.webp'];
function portrait(index) {
  const image = new Image();
  image.src = portraitPaths[index];
  image.alt = FRIENDS[index].name;
  return image;
}
cast.replaceChildren(...FRIENDS.map((_, index) => portrait(index)));
const nextButton = document.getElementById('campaign-next');
const abilityButton = document.getElementById('ability');
const restartButton = document.getElementById('restart');
const arcade = createArcade(effect);
function showMode(mode) {
  if (dragPointer !== null) cancelDrag();
  activeMode = mode;
  const campaign = mode === 'campaign';
  arcade.panel.hidden = campaign;
  campaignPanel.hidden = !campaign;
  document.getElementById('campaign').setAttribute('aria-pressed', campaign);
  document.getElementById('mini-games').setAttribute('aria-pressed', !campaign);
  if (campaign) arcade.stop();
}
document.getElementById('campaign').onclick = () => showMode('campaign');
document.getElementById('mini-games').onclick = () => showMode('arcade');
nextButton.onclick = handleScreenClick;
abilityButton.onclick = () => launchedBird?.useAbility();
restartButton.onclick = () => startLevel(levelNum);
function shotPower() { return phone.matches ? .29 : .45; }
phone.addEventListener('change', () => {
  cancelDrag();
  W = phone.matches ? 720 : 1280;
  H = phone.matches ? 800 : 720;
  GROUND_Y = H - 100;
  SLING_X = phone.matches ? 145 : 200;
  SLING_Y = GROUND_Y - 30;
  canvas.width = W;
  canvas.height = H;
  backdrop = null;
  if (state === 'game') startLevel(levelNum);
});
function point(event) {
  const rect = canvas.getBoundingClientRect();
  return [(event.clientX - rect.left) * W / rect.width, (event.clientY - rect.top) * H / rect.height];
}
function cancelDrag() {
  if (dragging && currentBird) {
    currentBird.x = SLING_X;
    currentBird.y = SLING_Y - 65;
  }
  if (dragPointer !== null && canvas.hasPointerCapture(dragPointer)) canvas.releasePointerCapture(dragPointer);
  dragPointer = null;
  dragging = false;
  dragPos = null;
}
canvas.addEventListener('pointerdown', event => {
  if (event.button !== 0 || !event.isPrimary) return;
  if (state !== 'game') return;
  if (!currentBird || launchedBird || dragPointer !== null) return;
  const [x, y] = point(event);
  const radius = event.pointerType === 'touch' ? 68 : 48;
  if (Math.hypot(x - currentBird.x, y - currentBird.y) > radius) return;
  dragPointer = event.pointerId;
  canvas.setPointerCapture(event.pointerId);
  dragging = true;
  dragPos = [currentBird.x, currentBird.y];
});
canvas.addEventListener('pointermove', event => {
  if (event.pointerId !== dragPointer || !currentBird) return;
  const [x, y] = point(event);
  const dx = x - SLING_X, dy = y - (SLING_Y - 65);
  const scale = Math.min(1, 120 / Math.hypot(dx, dy));
  currentBird.x = SLING_X + dx * scale;
  currentBird.y = SLING_Y - 65 + dy * scale;
  dragPos = [currentBird.x, currentBird.y];
});
canvas.addEventListener('pointerup', event => {
  if (event.pointerId !== dragPointer || !currentBird) return;
  const dx = SLING_X - currentBird.x, dy = SLING_Y - 65 - currentBird.y;
  if (Math.hypot(dx, dy) >= 8) {
    currentBird.launch(dx * shotPower(), dy * shotPower());
    launchedBird = currentBird;
    currentBird = null;
  }
  cancelDrag();
});
for (const type of ['pointercancel', 'lostpointercapture']) {
  canvas.addEventListener(type, event => {
    if (event.pointerId === dragPointer) cancelDrag();
  });
}

document.addEventListener('keydown', e => {
  if (activeMode !== 'campaign' || e.target instanceof HTMLButtonElement || e.repeat) return;
  if (state === 'title' || state === 'win' || state === 'lose' || state === 'final') {
    if (e.key === 'Enter' || e.key === ' ') handleScreenClick();
    return;
  }
  if (state === 'game') {
    if (e.key === ' ' && launchedBird) { e.preventDefault(); launchedBird.useAbility(); }
    if (e.key === 'r' || e.key === 'R') startLevel(levelNum);
    if (e.key === 'Escape') { cancelDrag(); shake = 0; state = 'title'; }
  }
});

function handleScreenClick() {
  if (state === 'title') { startLevel(levelNum); }
  else if (state === 'win') {
    levelNum++; if (levelNum > 30) { state = 'final'; } else startLevel(levelNum);
  }
  else if (state === 'lose') { startLevel(levelNum); }
  else if (state === 'final') { levelNum = 1; totalScore = 0; state = 'title'; }
}

let shownState;
let shownQueue;
function syncCampaignUI() {
  const playing = state === 'game';
  if (shownState !== state) {
    campaignOverlay.hidden = playing;
    campaignHud.hidden = campaignActions.hidden = !playing;
    cast.hidden = state !== 'title';
    if (!playing) {
      const [heading, summary, label] = {
        title: ['Рогатка', 'Сбей все цели за отведённое число бросков. В кампании 30 уровней.', 'Играть'],
        win: ['Уровень пройден', `Уровень ${levelNum} из 30 · Счёт ${totalScore}`, 'Дальше'],
        lose: ['Цели уцелели', `Счёт ${totalScore}`, 'Повторить'],
        final: ['Все 30 уровней пройдены', `Итоговый счёт ${totalScore}`, 'В меню']
      }[state];
      campaignHeading.textContent = heading;
      campaignSummary.textContent = summary;
      nextButton.textContent = label;
    }
    shownState = state;
  }
  if (!playing) return;
  if (shownQueue !== birdQueue) {
    queueReadout.replaceChildren(...birdQueue.map(portrait));
    shownQueue = birdQueue;
  }
  Array.from(queueReadout.children).forEach((image, index) => {
    image.className = index < birdIdx ? 'used' : index === birdIdx ? 'current' : '';
  });
  const flight = launchedBird;
  abilityButton.disabled = !flight || flight.abilityUsed || flight.landed || flight.ability === 'normal';
  const ability = FRIENDS[birdQueue[birdIdx]]?.ability;
  for (const [element, label] of [
    [abilityButton, ability === 'speed' ? 'Ускорение' : ability === 'heavy' ? 'Удар вниз' : 'Способность'],
    [levelReadout, `Уровень ${levelNum}/30`],
    [scoreReadout, `Счёт ${totalScore + levelScore}`],
    [targetsReadout, `Цели ${levelData.pigs.filter(pig => pig.alive).length}`],
    [campaignTip, currentBird ? 'Потяни персонажа назад и отпусти.' :
      flight && !abilityButton.disabled ? 'Нажми на способность, пока персонаж в воздухе.' : 'Следи за броском.']
  ]) {
    if (element.textContent !== label) element.textContent = label;
  }
}

// === GAME UPDATE ===
function updateGame() {
  const { pigs, blocks } = levelData;

  if (launchedBird) {
    launchedBird.update();

    // Collision pigs
    pigs.forEach(pig => {
      if (!pig.alive) return;
      const dist = Math.hypot(launchedBird.x - pig.x, launchedBird.y - pig.y);
      if (dist < launchedBird.r + pig.r) {
        const spd = Math.hypot(launchedBird.vx, launchedBird.vy);
        let dmg = Math.max(1, Math.floor(spd / 4));
        if (launchedBird.ability === 'heavy') dmg = Math.ceil(dmg * 1.6);
        const killed = pig.hit(dmg);
        if (killed) { levelScore += 500; shake = 8; }
        launchedBird.vx *= -0.4; launchedBird.vy *= -0.35;
      }
    });

    // Collision blocks
    for (let i = blocks.length - 1; i >= 0; i--) {
      const blk = blocks[i];
      const bRect = { x: launchedBird.x - launchedBird.r, y: launchedBird.y - launchedBird.r, w: launchedBird.r * 2, h: launchedBird.r * 2 };
      if (bRect.x < blk.x + blk.w && bRect.x + bRect.w > blk.x &&
          bRect.y < blk.y + blk.h && bRect.y + bRect.h > blk.y) {
        const spd = Math.hypot(launchedBird.vx, launchedBird.vy);
        let dmg = Math.max(1, Math.floor(spd / 3));
        if (launchedBird.ability === 'heavy') dmg = Math.ceil(dmg * 1.6);
        const destroyed = blk.hit(dmg);
        if (destroyed) {
          blocks.splice(i, 1); levelScore += 100;
          pigs.forEach(pig => {
            if (!pig.alive) return;
            if (Math.hypot(pig.x - (blk.x + blk.w/2), pig.y - (blk.y + blk.h/2)) < 85) {
              if (pig.hit(1) && pig.alive === false) levelScore += 500;
            }
          });
        }
        launchedBird.vx *= -0.28; launchedBird.vy *= -0.45;
      }
    }

    pigs.forEach(p => p.draw && typeof p.wobble !== 'undefined' && p.wobble > 0 && p.wobble--);

    if (!launchedBird.alive) {
      launchedBird = null; waitTimer = 90;
    }
  }

  if (waitTimer > 0) {
    waitTimer--;
    if (waitTimer === 0) {
      birdIdx++;
      if (birdIdx < birdQueue.length) {
        currentBird = new Bird(SLING_X, SLING_Y - 65, birdQueue[birdIdx]);
      }
    }
  }

  if (shake > 0) shake--;

  updateParticles();

  const alivePigs = levelData.pigs.filter(p => p.alive);
  if (alivePigs.length === 0) {
    levelScore += Math.max(0, birdQueue.length - birdIdx - 1) * 300;
    totalScore += levelScore;
    state = 'win';
    effect(440, 550, 660);
    return;
  }
  if (!launchedBird && !currentBird && waitTimer === 0 && birdIdx >= birdQueue.length) {
    totalScore += levelScore;
    state = 'lose';
    effect(370, 260, 150);
  }
}

// === MAIN LOOP ===
let lastFrame = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const step = 1000 / 60;
  if (activeMode !== 'campaign') { lastFrame = now; return; }
  if (now - lastFrame < step - 1) return;
  lastFrame = Math.max(now - step, lastFrame + step);
  syncCampaignUI();

  const shaking = shake > 0;
  if (shaking) {
    ctx.save();
    ctx.translate((Math.random()-0.5)*shake*2, (Math.random()-0.5)*shake*1.5);
  }

  ctx.clearRect(0, 0, W, H);

  drawBackground();
  if (levelData && state !== 'title') {
    levelData.blocks.forEach(b => b.draw());
    levelData.pigs.forEach(p => { if (p.alive) p.draw(); });
    drawSlingshot(SLING_X, SLING_Y, currentBird, dragging, dragPos);

    if (dragging && currentBird) {
      drawTrajectory(currentBird.x, currentBird.y, SLING_X, SLING_Y);
    }
    if (currentBird) currentBird.draw();
    if (launchedBird) launchedBird.draw();
    drawParticles();
    if (state === 'game') updateGame();
    else updateParticles();
  }

  if (shaking) ctx.restore();
}

requestAnimationFrame(loop);
</script>
